# Tuned for a 16 GB dev machine that also runs WSL, Docker, Cursor and the Next dev server.
# Without these caps the Gradle and Kotlin daemons together exhaust physical RAM
# and the JVM dies with a native "insufficient memory" crash.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon=true

# Compile inside the Gradle daemon so a build needs one JVM instead of two.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
